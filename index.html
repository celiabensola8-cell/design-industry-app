<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Industry</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <!-- Splash Screen -->
    <div id="splash">
        <div class="stars"></div>

        <div class="splash-content">
            <img src="E20D773F-8121-495E-A64F-57EC5A29AB15.png" class="logo" alt="Logo Design Industry">

            <h1>DESIGN INDUSTRY</h1>

            <p>Le design qui accélère votre business</p>

            <div class="loading">
                <div class="loading-bar"></div>
            </div>
        </div>
    </div>

    <!-- Application -->
    <main id="app" class="hidden">

        <header class="hero">

            <img src="E20D773F-8121-495E-A64F-57EC5A29AB15.png" class="hero-logo" alt="Logo">

            <h1>DESIGN INDUSTRY</h1>

            <p id="welcome">
                Bienvenue !
            </p>

            <div class="hero-buttons">

                <button id="orderBtn" class="btn primary">
                    🚀 Commander
                </button>

                <button id="shopBtn" class="btn secondary">
                    🛍 Boutique
                </button>

            </div>

        </header>
