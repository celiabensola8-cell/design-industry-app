<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Industry</title>

<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="background"></div>

<div class="container">

    <img src="images/logo.png" class="logo" alt="Design Industry Logo">

    <h1>DESIGN INDUSTRY</h1>

    <p id="welcome">
        Bienvenue dans votre studio de création graphique.
    </p>

    <div class="buttons">

        <button class="btn secondary">🛍️ Boutique</button>
    </div>

    <section class="services">
        <h2>Nos services</h2>

        <div class="card">🎨 Logo</div>
        <div class="card">📄 Flyer</div>
        <div class="card">🤖 Bot Telegram</div>
        <div class="card">📱 Mini App</div>
        <div class="card">🌐 Site Web</div>
    </section>

</div>

<nav class="bottom-nav">
    <button>🏠<br>Accueil</button>
    <button>🛍️<br>Boutique</button>
    <button>📦<br>Packs</button>
    <button>🛒<br>Panier</button>

</nav>

<script src="script.js"></script>

</html>
